<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FunApps</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 20px;
    }
    h1 {
      text-align: center;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #e94560;
    }
    p.subtitle {
      text-align: center;
      color: #a8b2d8;
      margin-bottom: 40px;
    }
    .apps {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 800px;
      margin: 0 auto;
    }
    .app-card {
      background: #16213e;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      width: 160px;
      transition: transform 0.2s, background 0.2s;
      border: 2px solid transparent;
    }
    .app-card:hover {
      transform: translateY(-4px);
      background: #0f3460;
      border-color: #e94560;
    }
    .app-card .icon { font-size: 48px; margin-bottom: 12px; }
    .app-card .name { font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>FunApps</h1>
  <p class="subtitle">A collection of mini apps</p>
  <div class="apps">
    <a class="app-card" href="Calculator/">
      <div class="icon">🧮</div>
      <div class="name">Calculator</div>
    </a>
    <a class="app-card" href="TicTacToe/">
      <div class="icon">⭕</div>
      <div class="name">Tic Tac Toe</div>
    </a>
    <a class="app-card" href="RandomQuote/">
      <div class="icon">💬</div>
      <div class="name">Random Quote</div>
    </a>
    <a class="app-card" href="LinkedInPost/">
      <div class="icon">💼</div>
      <div class="name">LinkedIn Post</div>
    </a>
  </div>
</body>
</html>
