<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>

    <div class="mode-selector">
      <button class="mode-btn active" data-mode="2p">2 Players</button>
      <button class="mode-btn" data-mode="ai">vs AI</button>
    </div>

    <div class="scoreboard">
      <div class="score-card" id="score-x">
        <div class="score-label">X</div>
        <div class="score-value" id="wins-x">0</div>
      </div>
      <div class="score-card draws">
        <div class="score-label">Draws</div>
        <div class="score-value" id="draws">0</div>
      </div>
      <div class="score-card" id="score-o">
        <div class="score-label">O</div>
        <div class="score-value" id="wins-o">0</div>
      </div>
    </div>

    <div class="status" id="status">Player X's turn</div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <button class="restart-btn" id="restart">New Game</button>
    <a class="back-link" href="../">&#8592; Back to FunApps</a>
  </div>

  <div class="overlay" id="overlay">
    <div class="result-card">
      <div class="result-icon" id="result-icon"></div>
      <div class="result-text" id="result-text"></div>
      <button class="restart-btn" id="play-again">Play Again</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
